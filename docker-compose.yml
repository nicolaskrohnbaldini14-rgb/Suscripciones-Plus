services:
  database:
    image: postgres:18
    container_name: postgres-db-TKC
    # las credenciales se leen del archivo .env (ver .env.example)
    env_file: .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      # $$ hace que la variable la resuelva el contenedor y no docker compose
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      # hasta ~2 minutos para que la base esté lista (por ejemplo, en una
      # máquina lenta o la primera vez que arranca)
      retries: 60
      start_period: 5s

volumes:
  pgdata:
